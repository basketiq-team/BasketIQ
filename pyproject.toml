[project]
name = "basketiq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
backend = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
ml = [
    "albumentations>=2.0.8",
    "datasets>=5.1.0",
    "easyocr>=1.7.2",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "onnx>=1.23.2",
    "pandas>=3.1.1",
    "pytesseract>=0.3.13",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.2",
]

[tool.uv]
default-groups = ["dev", "backend", "ml"]